services:
  - type: web
    name: medicare-ai-backend
    runtime: node
    plan: free
    rootDir: MediCareAI/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REQUIRE_AUTH
        value: "true"
      - key: MODEL
        value: claude-sonnet-5-5
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/serviceAccount.json
      - key: ANTHROPIC_API_KEY
        sync: false
